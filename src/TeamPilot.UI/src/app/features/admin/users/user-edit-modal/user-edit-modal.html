<app-modal [open]="open()" title="Edit User" size="lg" (closed)="closed.emit()">
  @if (user(); as user) {
    <p class="text-body-secondary mb-3">{{ user.name }} &lt;{{ user.email }}&gt;</p>

    <h3 class="h6">Roles</h3>
    <div class="d-flex gap-3 mb-2">
      @for (role of roles; track role) {
        <label class="form-check">
          <input
            type="checkbox"
            class="form-check-input"
            [checked]="isRoleSelected(role)"
            (change)="toggleRole(role)"
          />
          <span class="form-check-label">{{ role }}</span>
        </label>
      }
    </div>
    <button type="button" class="btn btn-sm btn-outline-primary mb-4" (click)="saveRoles()">
      Save Roles
    </button>

    <h3 class="h6">Assigned Projects</h3>
    @if (!allProjects().length) {
      <p class="text-body-secondary small">No projects exist yet.</p>
    } @else {
      <div class="list-group mb-2" style="max-height: 12rem; overflow-y: auto">
        @for (project of allProjects(); track project.id) {
          <label class="list-group-item d-flex align-items-center gap-2">
            <input
              type="checkbox"
              class="form-check-input mt-0"
              [checked]="isProjectAssigned(project.id)"
              (change)="toggleProject(project.id)"
            />
            {{ project.name }}
          </label>
        }
      </div>
      <button type="button" class="btn btn-sm btn-outline-primary mb-3" (click)="saveProjects()">
        Save Projects
      </button>
    }

    <div class="d-flex justify-content-between align-items-center border-top pt-3">
      <span class="small text-body-secondary">Account status: {{ user.status }}</span>
      <button type="button" class="btn btn-sm btn-outline-danger" (click)="statusToggled.emit()">
        {{ user.status === 'Active' ? 'Disable Account' : 'Enable Account' }}
      </button>
    </div>
  }

  <div class="d-flex justify-content-end mt-3">
    <button type="button" class="btn btn-outline-secondary" (click)="closed.emit()">Close</button>
  </div>
</app-modal>
