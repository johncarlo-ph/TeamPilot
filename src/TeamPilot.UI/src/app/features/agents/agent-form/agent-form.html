<app-modal [open]="open()" title="New Agent" (closed)="closed.emit()">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="mb-3">
      <label for="agent-name" class="form-label">Name</label>
      <input id="agent-name" type="text" class="form-control" formControlName="name" />
      @if (form.controls.name.invalid && form.controls.name.touched) {
        <div class="text-danger small mt-1">Name is required.</div>
      }
    </div>
    <div class="mb-3">
      <label for="agent-role" class="form-label">Role</label>
      <select id="agent-role" class="form-select" formControlName="role">
        @for (role of roles; track role) {
          <option [value]="role">{{ role }}</option>
        }
      </select>
    </div>
    <div class="mb-3">
      <label for="agent-config" class="form-label">Configuration (JSON, optional)</label>
      <textarea
        id="agent-config"
        class="form-control font-monospace"
        rows="4"
        formControlName="configurationJson"
      ></textarea>
    </div>
    <div class="d-flex justify-content-end gap-2">
      <button type="button" class="btn btn-outline-secondary" (click)="closed.emit()">Cancel</button>
      <button type="submit" class="btn btn-primary">Create</button>
    </div>
  </form>
</app-modal>
