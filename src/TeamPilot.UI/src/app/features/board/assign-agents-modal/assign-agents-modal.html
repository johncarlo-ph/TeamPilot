<app-modal [open]="open()" title="Assign Agents" (closed)="closed.emit()">
  @if (!agents().length) {
    <p class="text-body-secondary">No active agents available for this project yet.</p>
  } @else {
    <div class="list-group mb-3">
      @for (agent of agents(); track agent.id) {
        <label class="list-group-item d-flex align-items-center gap-2">
          <input
            type="checkbox"
            class="form-check-input mt-0"
            [checked]="isSelected(agent.id)"
            (change)="toggle(agent.id)"
          />
          <span class="flex-grow-1">{{ agent.name }}</span>
          <span class="badge text-bg-light border">{{ agent.role }}</span>
        </label>
      }
    </div>
  }
  <div class="d-flex justify-content-end gap-2">
    <button type="button" class="btn btn-outline-secondary" (click)="closed.emit()">Cancel</button>
    <button type="button" class="btn btn-primary" [disabled]="!selectedIds().size" (click)="submit()">
      Assign
    </button>
  </div>
</app-modal>
