<div class="card">
  <div class="card-header">Git</div>
  <div class="card-body">
    @if (!ticket().branchName) {
      <div class="input-group mb-3">
        <input
          type="text"
          class="form-control"
          placeholder="feature/my-branch"
          [ngModel]="newBranchName()"
          (ngModelChange)="newBranchName.set($event)"
        />
        <button type="button" class="btn btn-outline-primary" (click)="createBranch()">
          Link Branch
        </button>
      </div>
    } @else {
      <p class="mb-3">
        Linked branch: <code>{{ ticket().branchName }}</code>
      </p>
    }

    <h3 class="h6">Compare branches</h3>
    <div class="row g-2 align-items-end mb-3">
      <div class="col-auto">
        <label class="form-label small mb-1">Source</label>
        <input
          type="text"
          class="form-control form-control-sm"
          [ngModel]="sourceBranch()"
          (ngModelChange)="sourceBranch.set($event)"
        />
      </div>
      <div class="col-auto">
        <label class="form-label small mb-1">Target</label>
        <input
          type="text"
          class="form-control form-control-sm"
          [placeholder]="ticket().branchName ?? 'target branch'"
          [ngModel]="targetBranch()"
          (ngModelChange)="targetBranch.set($event)"
        />
      </div>
      <div class="col-auto">
        <button type="button" class="btn btn-sm btn-outline-secondary" [disabled]="diffLoading()" (click)="loadDiff()">
          View Diff
        </button>
      </div>
    </div>

    @if (diffResult(); as result) {
      @if (!result.files.length) {
        <p class="text-body-secondary mb-0">No differences between these branches.</p>
      } @else {
        @for (file of result.files; track file.filePath) {
          <p class="small fw-semibold mb-1">{{ file.filePath }}</p>
          <app-diff-viewer [content]="file.patch" class="d-block mb-3"></app-diff-viewer>
        }
      }
    }
  </div>
</div>
