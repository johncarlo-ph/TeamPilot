<div class="card ticket-card shadow-sm position-relative mb-2">
  <div class="card-body p-2">
    <h3 class="h6 mb-1">
      <a
        class="stretched-link text-decoration-none text-body"
        [routerLink]="['/tickets', ticket().id]"
        >{{ ticket().title }}</a
      >
    </h3>
    @if (ticket().branchName) {
      <p class="small text-body-secondary mb-1">
        <code>{{ ticket().branchName }}</code>
      </p>
    }
    <p class="small text-body-tertiary mb-0">
      Updated {{ ticket().updatedAtUtc || ticket().createdAtUtc | date: 'short' }}
    </p>
  </div>
</div>
