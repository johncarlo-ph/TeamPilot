<app-modal [open]="open()" title="New Ticket" (closed)="closed.emit()">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="mb-3">
      <label for="ticket-title" class="form-label">Title</label>
      <input id="ticket-title" type="text" class="form-control" formControlName="title" />
      @if (form.controls.title.invalid && form.controls.title.touched) {
        <div class="text-danger small mt-1">Title is required.</div>
      }
    </div>
    <div class="mb-3">
      <label for="ticket-description" class="form-label">Description</label>
      <textarea
        id="ticket-description"
        class="form-control"
        rows="4"
        formControlName="description"
      ></textarea>
    </div>
    <div class="d-flex justify-content-end gap-2">
      <button type="button" class="btn btn-outline-secondary" (click)="closed.emit()">Cancel</button>
      <button type="submit" class="btn btn-primary">Create</button>
    </div>
  </form>
</app-modal>
