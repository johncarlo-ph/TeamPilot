<app-modal [open]="open()" title="Submit Review" (closed)="closed.emit()">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="mb-3">
      <label for="reviewer-name" class="form-label">Reviewer name</label>
      <input id="reviewer-name" type="text" class="form-control" formControlName="reviewerName" />
    </div>
    <div class="mb-3">
      <label for="review-decision" class="form-label">Decision</label>
      <select id="review-decision" class="form-select" formControlName="decision">
        <option value="Approve" [disabled]="!canApprove">Approve</option>
        <option value="RequestChanges">Request Changes</option>
        <option value="ResolveConflict">Resolve Conflict</option>
      </select>
      @if (!authService.canApprove()) {
        <div class="form-text">Only Admins and Developers may approve a ticket.</div>
      } @else if (!hasLinkedBranch()) {
        <div class="form-text">Link a branch to this ticket before it can be approved.</div>
      }
    </div>
    <div class="mb-3">
      <label for="review-comments" class="form-label">Comments</label>
      <textarea
        id="review-comments"
        class="form-control"
        rows="3"
        formControlName="comments"
      ></textarea>
    </div>
    <div class="d-flex justify-content-end gap-2">
      <button type="button" class="btn btn-outline-secondary" (click)="closed.emit()">Cancel</button>
      <button type="submit" class="btn btn-primary">Submit</button>
    </div>
  </form>
</app-modal>
