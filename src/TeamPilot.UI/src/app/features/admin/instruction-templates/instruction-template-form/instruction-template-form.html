<app-modal
  [open]="open()"
  [title]="isEditing ? 'Edit Instruction Template' : 'New Instruction Template'"
  size="lg"
  (closed)="closed.emit()"
>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="mb-3">
      <label for="template-name" class="form-label">Name</label>
      <input id="template-name" type="text" class="form-control" formControlName="name" />
      @if (form.controls.name.invalid && form.controls.name.touched) {
        <div class="text-danger small mt-1">Name is required.</div>
      }
    </div>
    <div class="row g-3 mb-3">
      <div class="col-6">
        <label for="template-role" class="form-label">Agent Role</label>
        <select id="template-role" class="form-select" formControlName="role">
          @for (role of roles; track role) {
            <option [value]="role">{{ role }}</option>
          }
        </select>
        @if (isEditing) {
          <div class="form-text">Can't be changed after creation.</div>
        }
      </div>
      <div class="col-6">
        <label for="template-type" class="form-label">Instruction Type</label>
        <select id="template-type" class="form-select" formControlName="type">
          @for (type of types; track type) {
            <option [value]="type">{{ type }}</option>
          }
        </select>
        @if (isEditing) {
          <div class="form-text">Can't be changed after creation.</div>
        }
      </div>
    </div>
    <div class="mb-3">
      <label for="template-content" class="form-label">Content</label>
      <textarea
        id="template-content"
        class="form-control font-monospace"
        rows="6"
        formControlName="content"
      ></textarea>
      @if (form.controls.content.invalid && form.controls.content.touched) {
        <div class="text-danger small mt-1">Content is required.</div>
      }
    </div>
    <div class="d-flex justify-content-end gap-2">
      <button type="button" class="btn btn-outline-secondary" (click)="closed.emit()">
        Cancel
      </button>
      <button type="submit" class="btn btn-outline-primary">
        {{ isEditing ? 'Save' : 'Create' }}
      </button>
    </div>
  </form>
</app-modal>
